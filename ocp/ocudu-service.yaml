#
# OpenShift/Kubernetes manifest for OCUDU 5GC and gNB services.
# Based on docker/docker-compose.yml.
# Apply from ocp dir: oc apply -f ocudu-service.yaml && oc apply -f ocudu-scc.yaml
#
# Images:
#   - 5GC: quay.io/kschinck/docker_5gc:20260205
#   - gNB: quay.io/kschinck/gnb:20260205
#
---
apiVersion: v1
kind: Namespace
metadata:
  name: ocudu
  labels:
    name: ocudu
---
# 5GC environment (MongoDB, UE subnet, etc.). MONGODB_IP is localhost inside the 5gc pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fivegc-env
  namespace: ocudu
data:
  MONGODB_IP: "127.0.0.1"
  OPEN5GS_IP: "10.53.1.2"
  UE_IP_BASE: "10.45.0"
  UPF_ADVERTISE_IP: "10.53.1.2"
  DEBUG: "false"
  SUBSCRIBER_DB: "001010123456780,00112233445566778899aabbccddeeff,opc,63bfa50ee6523365ff14c1f45f88737d,8000,9,10.45.1.2"
  NETWORK_NAME_FULL: "OCUDU"
  NETWORK_NAME_SHORT: "OCUDU"
  TZ: "Europe/Madrid"
  UE_GATEWAY_IP: "10.45.0.1"
  UE_IP_RANGE: "10.45.0.0/24"
  INSTALL_ARCH: "x86_64-linux-gnu"
---
# 5GC config template (from docker/open5gs/open5gs-5gc.yml). Mounted as open5gs-5gc.yml.in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fivegc-5gc-yml-in
  namespace: ocudu
data:
  open5gs-5gc.yml.in: |
    mongodb:
      enabled: true
      auth:
        enabled: false
    smf:
      enabled: true
      config:
        scp:
          enabled: true
        pcrf:
          enabled: false
        subnetList:
        - subnet: 10.45.0.1/16
          dnn: srsapn
    upf:
      enabled: true
      config:
        subnetList:
        - subnet: 10.45.0.1/16
          dnn: srsapn
          dev: ogstun
          createDev: true
          enableNAT: true
    webui:
      enabled: true
      services:
        http:
          type: NodePort
          ports:
            http: 9999
        nodePorts:
          http: 30002
    
    # 4G
    hss:
      enabled: false
      mongodb:
        enabled: false
    mme:
      enabled: false
    pcrf:
      enabled: false
      mongodb:
        enabled: false
    sgwc:
      enabled: false
    sgwu:
      enabled: false
    
    # 5G
    amf:
      enabled: true
      config:
        networkName: "OCUDU"
        guamiList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
            amf_id:
              region: 2
              set: 1
        taiList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
            tac: [7]
        plmnList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
            s_nssai:
              - sst: 1
                sd: "0x1"
    ausf:
      enabled: true
    bsf:
      enabled: true
    nrf:
      enabled: true
      config:
        logLevel: info
        servingList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
    nssf:
      enabled: true
      config:
        nsiList:
          - nrf:
              hostname: ""  # if empty default is autogenerated open5gs svc fullname
              port: 7777
            sst: 1
            sd: "0x1"
    pcf:
      enabled: true
      mongodb:
        enabled: false
    udm:
      enabled: true
    udr:
      enabled: true
      mongodb:
        enabled: false
    scp:
      enabled: true
      mongodb:
        enabled: false
    
---
# gNB compose overlay: AMF address set to fivegc service (in-cluster DNS)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gnb-compose-config
  namespace: ocudu
data:
  gnb_compose_config.yml: |
    cu_cp:
      amf:
        addrs: fivegc
        bind_addrs: 0.0.0.0
    metrics:
      autostart_stdout_metrics: true
      enable_json: true
    remote_control:
      bind_addr: 0.0.0.0
      enabled: true
---
# Default gNB cell config (B200 TDD n78 20MHz). Replace with your own ConfigMap if needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gnb-config
  namespace: ocudu
data:
  gnb_config.yml: |
    cu_cp:
      amf:
        addrs: 127.0.1.100
        port: 38412
        bind_addrs: 127.0.0.1
        supported_tracking_areas:
          - tac: 7
            plmn_list:
              - plmn: "00101"
                tai_slice_support_list:
                  - sst: 1
    ru_sdr:
      device_driver: uhd
      device_args: type=b200,num_recv_frames=64,num_send_frames=64
      srate: 23.04
      otw_format: sc12
      tx_gain: 80
      rx_gain: 40
    cell_cfg:
      dl_arfcn: 632628
      band: 78
      channel_bandwidth_MHz: 20
      common_scs: 30
      plmn: "00101"
      tac: 7
      pci: 1
    log:
      filename: /tmp/gnb.log
      all_level: warning
    pcap:
      mac_enable: false
      mac_filename: /tmp/gnb_mac.pcap
      ngap_enable: false
      ngap_filename: /tmp/gnb_ngap.pcap
---
# Service name must be DNS-1035 (start with letter); "5gc" is invalid so use "fivegc"
apiVersion: v1
kind: Service
metadata:
  name: fivegc
  namespace: ocudu
  labels:
    app: 5gc
spec:
  ports:
    - name: web
      port: 9999
      targetPort: 9999
      protocol: TCP
  selector:
    app: 5gc
---
apiVersion: v1
kind: Service
metadata:
  name: gnb
  namespace: ocudu
  labels:
    app: gnb
spec:
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: gnb
---
# 5GC deployment. Uses the image entrypoint so that dummy interfaces (127.0.0.2-22),
# MongoDB, envsubst, webui, setup_tun, add_users and 5gc all run. Requires the custom SCC
# and RBAC from ocudu-scc.yaml so the pod can run as root and create interfaces. Apply order:
#   oc apply -f ocudu-service.yaml && oc apply -f ocudu-scc.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fivegc
  namespace: ocudu
  labels:
    app: 5gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 5gc
  template:
    metadata:
      labels:
        app: 5gc
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: 5gc
          image: quay.io/kschinck/docker_5gc:20260211-01
          workingDir: /open5gs
          # Use image entrypoint so dummy interfaces, MongoDB, envsubst, webui, add_users and 5gc run
          ports:
            - containerPort: 9999
              name: web
          envFrom:
            - configMapRef:
                name: fivegc-env
          volumeMounts:
            - name: fivegc-5gc-yml-in
              mountPath: /open5gs/open5gs-5gc.yml.in
              subPath: open5gs-5gc.yml.in
              readOnly: true
            - name: fivegc-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.20", "7777"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.20", "7777"]
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
              drop: ["ALL"]
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: fivegc-5gc-yml-in
          configMap:
            name: fivegc-5gc-yml-in
        - name: fivegc-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb
  namespace: ocudu
  labels:
    app: gnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gnb
  template:
    metadata:
      labels:
        app: gnb
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gnb
          image: quay.io/kschinck/gnb:20260209
          command: ["gnb", "-c", "/gnb_config/gnb_config.yml", "-c", "/gnb_compose_config/gnb_compose_config.yml"]
          ports:
            - containerPort: 8001
              name: metrics
          env:
            - name: OPEN5GS_IP
              value: "fivegc"
            - name: GNB_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: gnb-config
              mountPath: /gnb_config
              readOnly: true
            - name: gnb-compose-config
              mountPath: /gnb_compose_config
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: gnb-config
          configMap:
            name: gnb-config
        - name: gnb-compose-config
          configMap:
            name: gnb-compose-config
---
