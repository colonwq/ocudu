# Build parameters (env or .env):
#   OS          Base OS: fedora | ubuntu | quay.io/centos/centos (default: fedora)
#   OS_VERSION  OS version, e.g. 43 (Fedora), 24.04 (Ubuntu), stream10 (CentOS 10) (default: 43)
#   ENABLE_GDB  Set to "1" to install GDB and run gnb under GDB for backtrace on crash (default: unset)

services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: open5gs
      target: open5gs
      args:
        OS: ${OS:-fedora}
        OS_VERSION: ${OS_VERSION:-43}
        OPEN5GS_VERSION: "v2.7.0"
    env_file:
      - ${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env}
    privileged: true
    ports:
      - "9999:9999/tcp"
    # Uncomment port to use the 5gc from outside the docker network
    #  - "38412:38412/sctp"
    #  - "2152:2152/udp"
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.20 7777"]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        ipv4_address: ${OPEN5GS_IP:-10.53.1.2}

  gnb:
    container_name: ocudu_gnb
    # Build info
    image: ocudu/gnb
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OS: ${OS:-fedora}
        OS_VERSION: ${OS_VERSION:-43}
        ENABLE_GDB: ${ENABLE_GDB:-}
    # privileged mode is requred only for accessing usb devices
    privileged: true
    # Extra capabilities always required
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      # Access USB to use some SDRs
      - /dev/bus/usb/:/dev/bus/usb/
      # UHD device images (named volume so path exists; override with host path if you have UHD installed, e.g. - /usr/share/uhd/images:/usr/share/uhd/images)
      - uhd-images:/usr/share/uhd/images
      # Save logs and more into gnb-storage
      - gnb-storage:/tmp
      # Config files (volume mounts work with podman-compose; configs: may not mount at expected paths)
      - ${GNB_CONFIG_PATH:-../configs/gnb_rf_b200_tdd_n78_20mhz.yml}:/gnb_config.yml:ro
      - ./gnb_compose_config.yml:/gnb_compose_config.yml:ro
    # Customize your desired network mode.
    # current netowrk configuration creastes a private netwoek with both containers attached
    # An alterantive would be `network: host"`. That would expose your host network into the container. It's the easiest to use if the 5gc is not in your PC
    networks:
      ran:
        ipv4_address: ${GNB_IP:-10.53.1.3}
      metrics:
        ipv4_address: 172.19.1.3
    # Start GNB container after 5gc is up and running
    depends_on:
      5gc:
        condition: service_healthy
    # Args passed to entrypoint (gnb -c ...); set ENABLE_GDB=1 when building to run under GDB
    command: ["-c", "/gnb_config.yml", "-c", "/gnb_compose_config.yml"]

volumes:
  gnb-storage:
  uhd-images:

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24
