#
# ConfigMap: open5gs-5gc.yml template (from docker/open5gs/open5gs-5gc.yml).
# Mounted as open5gs-5gc.yml.in; container runs envsubst to produce open5gs-5gc.yml.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: fivegc-5gc-yml-in
  namespace: ocudu
data:
  open5gs-5gc.yml.in: |
    mongodb:
      enabled: true
      auth:
        enabled: false
    smf:
      enabled: true
      config:
        scp:
          enabled: true
        pcrf:
          enabled: false
        subnetList:
        - subnet: 10.45.0.1/16
          dnn: srsapn
    upf:
      enabled: true
      config:
        subnetList:
        - subnet: 10.45.0.1/16
          dnn: srsapn
          dev: ogstun
          createDev: true
          enableNAT: true
    webui:
      enabled: true
      services:
        http:
          type: NodePort
          ports:
            http: 9999
        nodePorts:
          http: 30002
    
    # 4G
    hss:
      enabled: false
      mongodb:
        enabled: false
    mme:
      enabled: false
    pcrf:
      enabled: false
      mongodb:
        enabled: false
    sgwc:
      enabled: false
    sgwu:
      enabled: false
    
    # 5G
    amf:
      enabled: true
      config:
        networkName: "OCUDU"
        guamiList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
            amf_id:
              region: 2
              set: 1
        taiList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
            tac: [7]
        plmnList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
            s_nssai:
              - sst: 1
                sd: "0x1"
    ausf:
      enabled: true
    bsf:
      enabled: true
    nrf:
      enabled: true
      config:
        logLevel: info
        servingList:
          - plmn_id:
              mcc: "001"
              mnc: "01"
    nssf:
      enabled: true
      config:
        nsiList:
          - nrf:
              hostname: ""  # if empty default is autogenerated open5gs svc fullname
              port: 7777
            sst: 1
            sd: "0x1"
    pcf:
      enabled: true
      mongodb:
        enabled: false
    udm:
      enabled: true
    udr:
      enabled: true
      mongodb:
        enabled: false
    scp:
      enabled: true
      mongodb:
        enabled: false
    
