#
# Optional second Telegraf config: Prometheus remote write to a receiver on OpenShift/OCP
# (e.g. Grafana Mimir, Thanos receive, or User Workload Monitoring Prometheus).
#
# Grafana does not accept Telegraf metrics directly; it queries a time-series backend.
# Enable this path by setting PROMETHEUS_REMOTE_WRITE_URL (see docker/.env). The entrypoint
# merges this file with telegraf.conf when that variable is non-empty.
#
# Typical Mimir gateway URL shape:
#   https://<mimir-gateway-route>/api/v1/push
# Cluster-internal example:
#   http://mimir-distributor.observability.svc:8080/api/v1/push
#

[[outputs.http]]
  url = "${PROMETHEUS_REMOTE_WRITE_URL}"
  method = "POST"
  timeout = "30s"
  data_format = "prometheusremotewrite"
  namedrop = ["internal_*"]

  [outputs.http.headers]
    Content-Type = "application/x-protobuf"
    Content-Encoding = "snappy"
    X-Prometheus-Remote-Write-Version = "0.1.0"

  # Optional basic auth (leave empty if unused)
  # username = "${PROMETHEUS_REMOTE_WRITE_USER}"
  # password = "${PROMETHEUS_REMOTE_WRITE_PASSWORD}"

  # For bearer-token endpoints (e.g. some cloud offerings), add a header via env and
  # duplicate this block in a local override, or use TELEGRAF_CLI_EXTRA_ARGS with a
  # custom config fragment.
